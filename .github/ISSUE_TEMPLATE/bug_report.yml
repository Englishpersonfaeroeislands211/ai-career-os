name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail
        for someone else to reproduce the issue locally.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Match analysis stays pending forever after saving a job...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps, API calls, or screenshots if helpful.
      placeholder: |
        1. Start backend with `uv run uvicorn app.main:app --reload`
        2. Open job detail for job ID ...
        3. Click Re-analyze
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend / UI
        - Match analysis
        - Resume extraction
        - Job extraction
        - Company research
        - Cover letter / resume optimization
        - Database / migrations
        - CI / tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or version (optional)
      placeholder: main @ abc1234 or v0.1.0

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser, LLM provider (local vs cloud).
      placeholder: |
        macOS 15, Python 3.12, Chrome 138
        LLM: LM Studio / Qwen 3.5 9B @ http://127.0.0.1:1234/v1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages
      description: Redact API keys and personal data.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I removed API keys and PII from logs or screenshots
          required: true
