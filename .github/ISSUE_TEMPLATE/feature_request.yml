name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests help shape the roadmap. Check
        [docs/project-status.md](https://github.com/semirturgay/ai-career-os/blob/main/docs/project-status.md)
        and open issues before proposing something already planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What pain point does this solve? Who benefits?
      placeholder: Match analysis doesn't cite which resume bullet supported a strength...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Match analysis / RAG
        - Job discovery
        - Resume / profile
        - Company research
        - Cover letter
        - LLM providers
        - Search providers
        - Frontend UX
        - Developer experience
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
        - label: I need guidance before implementing

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
